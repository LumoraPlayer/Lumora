name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # LUMORAPLAYER_PAT is the LumoraPlayer account's token; GITLAB_TOKEN and GITFLIC_TOKEN
    # are the GitLab and GitFlic tokens, and DISCORD_WEBHOOK_URL is the #releases channel's
    # incoming webhook. They live here rather than inline in the steps below because secrets
    # cannot be referenced in step `if:` conditions, and the steps must be skipped (not fail)
    # on forks that never set the secrets.
    env:
      MIRROR_TOKEN: ${{ secrets.LUMORAPLAYER_PAT }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITFLIC_TOKEN: ${{ secrets.GITFLIC_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Trakt and Simkl credentials come from repository secrets: there is no
      # keystore.properties on a runner, and without these the published APK builds fine
      # but ships a dead Trakt and Simkl pane. Unset (a fork with no secrets), they resolve
      # to empty and the app reports itself unconfigured rather than failing.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEYS: ${{ secrets.TMDB_API_KEYS }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          API_SPORTS_KEYS: ${{ secrets.API_SPORTS_KEYS }}
          SPORTAPI_KEYS: ${{ secrets.SPORTAPI_KEYS }}

      - name: Install matching build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename APK
        run: cp "${{ steps.sign_app.outputs.signedReleaseFile }}" app/build/outputs/apk/release/Lumora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APK
          path: app/build/outputs/apk/release/Lumora.apk
          compression-level: 0

      # Release notes come from the tag's own section of CHANGELOG.md, so a release says
      # what actually changed rather than just "download the APK". The awk block takes
      # everything between this version's "## x.y" heading and the next one; CR is
      # stripped first so a CRLF-edited file still matches, and if the tag has no section
      # (or the file is missing), it falls back to a generic body rather than publishing
      # an empty release. The heading must exist at the tag's commit - a tag cut before
      # its changelog entry is how v5.1 shipped a generic body.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Lumora ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$VERSION" '
              { sub(/\r$/, "") }
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Installation"
            echo "Download the APK below and install on your Android TV, Fire TV Stick, or phone."
          } > release-notes.md
          if [ "$(grep -c '[^[:space:]]' release-notes.md)" -le 4 ]; then
            echo "No CHANGELOG entry for $VERSION - using generic notes"
            printf '## Lumora %s\n\n### Installation\nDownload the APK below and install on your Android TV, Fire TV Stick, or phone.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora.apk

      # Discord is fed from here, not from a repository webhook: Discord's GitHub
      # rendering keeps only its generic release card and drops the body, which is how
      # 6.3 shipped an announcement with no changelog in it. The script posts the notes
      # from release-notes.md as an embed and writes its message id into the release body
      # as an HTML comment, so a re-run edits that message instead of announcing twice.
      # A fork without the secret skips the step rather than failing the release.
      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/v') && env.DISCORD_WEBHOOK_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/discord_release.py

      # The same release goes to the other Lumora home - whichever repository that is for
      # this one, read from the MIRROR_REPO repository variable (one value per repository) so
      # the workflow pins no repository path. Uses the LumoraPlayer token (Contents: read and
      # write on that repository) - the built-in GITHUB_TOKEN only works inside its own
      # repository. A fork without the secret or the variable skips the step rather than
      # failing the release; a tag released in either repository mirrors to the other, so
      # both sides stay in sync.
      - name: Mirror Release to the other repository
        if: startsWith(github.ref, 'refs/tags/v') && env.MIRROR_TOKEN != '' && vars.MIRROR_REPO != ''
        uses: softprops/action-gh-release@v1
        with:
          repository: ${{ vars.MIRROR_REPO }}
          token: ${{ secrets.LUMORAPLAYER_PAT }}
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora.apk

      # The same release is also published to Lumora's GitLab and GitFlic homes, so an update
      # is downloadable from any of them. Both steps are idempotent - the tag reaches both
      # GitHub repositories, so either build may run them and a re-run refreshes what it
      # already created. A fork without the secret skips the step rather than failing the
      # release, exactly like the mirror step above.
      - name: Publish to GitLab
        if: startsWith(github.ref, 'refs/tags/v') && env.GITLAB_TOKEN != ''
        run: |
          set -euo pipefail
          PROJECT="LumoraPlayer%2FLumora"
          BASE="https://gitlab.com/api/v4/projects/$PROJECT"
          ASSET="$BASE/packages/generic/lumora/$GITHUB_REF_NAME/Lumora.apk"
          RELEASE="$BASE/releases/$GITHUB_REF_NAME"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          # Every call reports the status and GitLab's own error body before failing. The
          # old `curl -sf` swallowed both, so a rejected release POST read as a bare
          # "exit code 22" with no way to tell which call failed or why.
          gl() {
            local method="$1" url="$2" status
            shift 2
            status=$(curl -sS -o "$TMP/response" -w '%{http_code}' --request "$method" "$@" "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "GitLab $method $url failed: HTTP $status" >&2
              cat "$TMP/response" >&2
              return 1
            fi
            cat "$TMP/response"
          }

          # The APK goes to the generic package registry: unlike plain project uploads,
          # package files download anonymously on a public project, which is exactly what
          # the app's updater needs. The endpoint takes a raw body (--upload-file) - a
          # --form body would be stored verbatim, multipart wrapper and all.
          gl PUT "$ASSET" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --upload-file app/build/outputs/apk/release/Lumora.apk > /dev/null

          # Verify what anonymous clients will actually download.
          LOCAL_HASH=$(sha256sum app/build/outputs/apk/release/Lumora.apk | cut -d' ' -f1)
          REMOTE_HASH=$(curl -sf "$ASSET" | sha256sum | cut -d' ' -f1)
          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "GitLab asset mismatch: $REMOTE_HASH != $LOCAL_HASH"
            exit 1
          fi

          # Create the release, or refresh it when an earlier run (or the other
          # repository's copy of this workflow) already made one. A 404 on the lookup is
          # the only case that creates: any other failure must stop the step, not fall
          # through to a POST that hides the real error.
          STATUS=$(curl -sS -o "$TMP/release" -w '%{http_code}' \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$RELEASE")
          if [ "$STATUS" = "200" ]; then
            gl PUT "$RELEASE" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "name=Lumora $GITHUB_REF_NAME" \
              --data-urlencode "description@release-notes.md" > /dev/null
          elif [ "$STATUS" = "404" ]; then
            # `ref` is what lets GitLab create the tag as part of the release. Without it
            # the POST is rejected when the tag was never pushed to the GitLab home - the
            # APK upload above still succeeds, so the failure looks like a bad token.
            # A 409 means another run created the release between the lookup and here.
            STATUS=$(curl -sS -o "$TMP/release" -w '%{http_code}' --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "name=Lumora $GITHUB_REF_NAME" \
              --data-urlencode "tag_name=$GITHUB_REF_NAME" \
              --data-urlencode "ref=$GITHUB_SHA" \
              --data-urlencode "description@release-notes.md" "$BASE/releases")
            case "$STATUS" in
              2*|409) ;;
              *)
                echo "GitLab release create failed: HTTP $STATUS" >&2
                cat "$TMP/release" >&2
                exit 1
                ;;
            esac
          else
            echo "GitLab release lookup failed: HTTP $STATUS" >&2
            cat "$TMP/release" >&2
            exit 1
          fi

          # Replace the APK link so repeated runs don't stack duplicate links on the release.
          gl GET "$RELEASE/assets/links" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" > "$TMP/links"
          for LINK_ID in $(jq -r '.[].id' "$TMP/links"); do
            gl DELETE "$RELEASE/assets/links/$LINK_ID" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" > /dev/null
          done
          gl POST "$RELEASE/assets/links" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "name=Lumora.apk" --data-urlencode "url=$ASSET" \
            --data-urlencode "link_type=package" > /dev/null

      - name: Publish to GitFlic
        if: startsWith(github.ref, 'refs/tags/v') && env.GITFLIC_TOKEN != ''
        run: |
          set -euo pipefail
          BASE="https://api.gitflic.ru/project/lumora/lumora"
          APK="app/build/outputs/apk/release/Lumora.apk"

          # The release is hung on the tag, so make sure this home actually has it before
          # creating anything: a tag push that only reached GitHub used to leave GitFlic
          # unable to create the release. `lumora` is the account the token belongs to;
          # the other forms stay as fallbacks for a rotated transport token.
          git fetch --tags --force origin
          TAG_PUSHED=false
          for user in lumora oauth2 token gitflic; do
            if GIT_TERMINAL_PROMPT=0 git push \
                 "https://${user}:${GITFLIC_TOKEN}@gitflic.ru/project/lumora/lumora.git" \
                 "$GITHUB_REF_NAME" 2>/dev/null; then
              TAG_PUSHED=true
              break
            fi
          done
          if [ "$TAG_PUSHED" != "true" ]; then
            echo "GitFlic tag push failed with every authentication form"
            exit 1
          fi

          # The release is rebuilt from scratch on every run. GitFlic has no call to update
          # a release's description or to delete a single attachment (PATCH and the
          # per-file DELETE both answer 405), so an older attempt - or the other
          # repository's copy of this workflow - that left a stale description or APK can
          # only be replaced by deleting the release and recreating it. Deleting a release
          # does not delete its tag (checked).
          RELEASES=$(curl -s --header "Authorization: token $GITFLIC_TOKEN" "$BASE/release?size=100")
          STALE_ID=$(echo "$RELEASES" | jq -r --arg tag "$GITHUB_REF_NAME" '._embedded.releaseTagModelList[] | select(.tagName == $tag) | .id' | head -1)
          if [ -n "$STALE_ID" ]; then
            curl -sf --request DELETE --header "Authorization: token $GITFLIC_TOKEN" "$BASE/release/$STALE_ID" > /dev/null
          fi

          RELEASE_ID=$(jq -n --arg title "Lumora $GITHUB_REF_NAME" --arg tag "$GITHUB_REF_NAME" \
            --rawfile description release-notes.md \
            '{title: $title, description: $description, tagName: $tag, preRelease: false, attachProjectArchive: false}' \
            | curl -sf --request POST --header "Authorization: token $GITFLIC_TOKEN" \
                --header "Content-Type: application/json" --data @- "$BASE/release" | jq -r '.id')

          curl -sf --request POST --header "Authorization: token $GITFLIC_TOKEN" \
            --form "files=@$APK" \
            "$BASE/release/$RELEASE_ID/file" > /dev/null

          # Verify the attachment is byte-for-byte the built APK: a truncated upload (32 KiB
          # short, once) is invisible to a name-only check and must never ship. GitFlic
          # reports sha256 of what it actually stored.
          STORED_SHA=$(curl -s --header "Authorization: token $GITFLIC_TOKEN" "$BASE/release/$RELEASE_ID" | jq -r '.attachmentFiles[] | select(.name == "Lumora.apk") | .hashSha256' | head -1)
          LOCAL_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          if [ "$STORED_SHA" != "$LOCAL_SHA" ]; then
            echo "GitFlic attachment hash mismatch: $STORED_SHA != $LOCAL_SHA"
            exit 1
          fi
